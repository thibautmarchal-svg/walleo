<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App icon : full-bleed black square with the W card stack centered.
       rx=0 (square) — iOS / Android launchers apply their own rounded
       mask, so any rx here would create a visible double-round
       artifact (white corners showing the wallpaper). -->
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE65A"/>
      <stop offset="100%" stop-color="#FFD60A"/>
    </linearGradient>
  </defs>

  <!-- Fond plein noir -->
  <rect width="512" height="512" fill="#0A0A0A"/>

  <!-- W card stack centered. Front card is 320×376 — ~63% of the icon
       width, so the W reads instantly even on Spotlight thumbnails. -->
  <g transform="translate(256 256)">
    <!-- Back card, slight left lean -->
    <g transform="rotate(-8) translate(-160 -188)">
      <rect width="320" height="376" rx="44" fill="#FFD60A" opacity="0.35"/>
    </g>
    <!-- Front card with W -->
    <g transform="rotate(6) translate(-160 -188)">
      <rect width="320" height="376" rx="44" fill="url(#cardGrad)"/>
      <path d="M 70 128 L 114 289 L 160 186 L 206 289 L 250 128"
            fill="none"
            stroke="#0A0A0A"
            stroke-width="32"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>
  </g>
</svg>
