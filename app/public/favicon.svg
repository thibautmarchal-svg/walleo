<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App icon : full-bleed black square with the W card icon AND
       the "Walleo" wordmark stacked vertically. iOS / Android apply
       their own rounded mask, so rx=0 (square) avoids the visible
       wallpaper gap that a pre-rounded SVG would leave. -->
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE65A"/>
      <stop offset="100%" stop-color="#FFD60A"/>
    </linearGradient>
  </defs>

  <!-- Fond plein noir -->
  <rect width="512" height="512" fill="#0A0A0A"/>

  <!-- W card icon, centered upper-half -->
  <g transform="translate(256 196)">
    <!-- Back card -->
    <g transform="rotate(-8) translate(-90 -106)">
      <rect width="180" height="212" rx="24" fill="#FFD60A" opacity="0.35"/>
    </g>
    <!-- Front card + W -->
    <g transform="rotate(6) translate(-90 -106)">
      <rect width="180" height="212" rx="24" fill="url(#cardGrad)"/>
      <path d="M 40 72 L 65 162 L 90 106 L 115 162 L 140 72"
            fill="none"
            stroke="#0A0A0A"
            stroke-width="18"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Wordmark "Walleo" -->
  <text x="256" y="450"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif"
        font-size="86"
        font-weight="700"
        letter-spacing="-3"
        fill="#FAFAFA"
        text-anchor="middle">Walleo</text>
</svg>
