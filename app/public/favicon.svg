<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App icon : full-bleed black square with the W card stack centered.
       rx=0 (square) — iOS / Android launchers apply their own rounded
       mask, so any rx here would create a visible double-round
       artifact (white corners showing the wallpaper). -->
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE65A"/>
      <stop offset="100%" stop-color="#FFD60A"/>
    </linearGradient>
  </defs>

  <!-- Fond plein noir -->
  <rect width="512" height="512" fill="#0A0A0A"/>

  <!-- W card stack centered. The stack height is ~280px so it sits
       comfortably inside the iOS rounded mask without touching edges. -->
  <g transform="translate(256 256)">
    <!-- Back card, slight left lean -->
    <g transform="rotate(-8) translate(-115 -135)">
      <rect width="230" height="270" rx="32" fill="#FFD60A" opacity="0.35"/>
    </g>
    <!-- Front card with W -->
    <g transform="rotate(6) translate(-115 -135)">
      <rect width="230" height="270" rx="32" fill="url(#cardGrad)"/>
      <path d="M 50 92 L 82 208 L 115 134 L 148 208 L 180 92"
            fill="none"
            stroke="#0A0A0A"
            stroke-width="23"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>
  </g>
</svg>
