# Netlify config — Walleo PWA
#
# Build runs inside `app/` (Vite + React). The static output goes to `app/dist`.
# All routes fall back to index.html so React Router can handle them client-side.

[build]
  # When `base` is set, `publish` and `command` paths are resolved
  # relative to that base directory — so `publish = "dist"` becomes `app/dist`.
  base = "app"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# ---------------------------------------------------------------------------
# SPA fallback — any unknown URL serves index.html (React Router takes over).
# Asset files are not affected because Netlify checks for a real file first.
# /tesseract/* must keep its real 404 so Tesseract.js can fallback from
# .traineddata.gz to .traineddata when the .gz is missing.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/tesseract/*"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Global security headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), wake-lock=(self)"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    # CSP notes:
    #   - 'wasm-unsafe-eval' is needed for Tesseract / pdf.js wasm
    #   - 'unsafe-inline' on style-src is required for Tailwind v4 runtime
    #     injected styles
    #   - Tesseract assets are now self-hosted in public/tesseract/ — no
    #     CDN allowlist needed.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# ---------------------------------------------------------------------------
# Service worker & SW registrar — never cached, so updates ship immediately.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Web app manifest
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------------------
# Static assets — fingerprinted by Vite, safe to cache long-term.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
